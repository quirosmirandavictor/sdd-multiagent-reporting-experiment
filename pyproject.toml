[project]
name = "sdd-multiagent-reporting-experiment"
version = "0.1.0"
description = "Health check mínimo para validar el recorrido SDD"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.1",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
    "xlsxwriter==3.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
